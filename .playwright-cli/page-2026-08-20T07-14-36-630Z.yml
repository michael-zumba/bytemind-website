  - banner [ref=f6e2]:
    - generic [ref=f6e3]:
      - link "← ByteMind home" [ref=f6e4] [cursor=pointer]:
        - /url: https://www.bytemind.co.nz/
      - heading "ByteProof Privacy Policy" [level=1] [ref=f6e5]
      - paragraph [ref=f6e6]: "Effective date: 14 August 2026"
  - main [ref=f6e7]:
    - paragraph [ref=f6e8]: ByteMind Ltd ("we", "us") operates ByteProof, a desktop AI proofreading app for macOS and Windows. This policy explains what information ByteProof collects, how it is used, and the choices you have.
    - heading "1. What ByteProof does" [level=2] [ref=f6e9]
    - paragraph [ref=f6e10]: ByteProof proofreads text and documents. It runs a local AI model on your own computer, and optionally lets you connect your own API key to a cloud AI provider (such as DeepSeek, OpenAI, Anthropic, Google, Groq, xAI, Perplexity, or a local Ollama server).
    - heading "2. Information we collect" [level=2] [ref=f6e11]
    - list [ref=f6e12]:
      - listitem [ref=f6e13]:
        - strong [ref=f6e14]: "Licence and payment details:"
        - text: when you buy a ByteProof licence, the email address used at checkout, your payment status, and a machine identifier used to bind your licence (up to two computers per licence). Payments are processed by Stripe; we never see or store your card details.
      - listitem [ref=f6e15]:
        - strong [ref=f6e16]: "Activation records:"
        - text: a record that your email address has activated ByteProof on a particular computer, so the two-computer limit can be enforced.
      - listitem [ref=f6e17]:
        - strong [ref=f6e18]: "Support communications:"
        - text: any information you choose to send us by email.
    - heading "3. Your document content and AI processing" [level=2] [ref=f6e19]
    - list [ref=f6e20]:
      - listitem [ref=f6e21]:
        - strong [ref=f6e22]: "Local AI mode (default):"
        - text: text is processed entirely on your device. No document content is sent to us or to any cloud provider.
      - listitem [ref=f6e23]:
        - strong [ref=f6e24]: "Bring-your-own-key mode:"
        - text: if you connect your own API key, the text you select for proofreading is sent to the provider you chose, and is handled under that provider's terms and privacy policy. Your API key is stored on your own computer, never on our servers, and we never see it.
      - listitem [ref=f6e25]:
        - strong [ref=f6e26]: "Microsoft Word integration:"
        - text: Word documents are accessed locally on your computer so ByteProof can insert tracked changes and comments.
    - heading "4. Automatic technical information" [level=2] [ref=f6e27]
    - paragraph [ref=f6e28]: ByteProof checks our website for new versions. That request is handled by our hosting provider, which may record standard technical information such as your IP address. We do not use analytics, advertising trackers, or telemetry in ByteProof, and we do not monitor how you use the app.
    - heading "5. How we store and protect information" [level=2] [ref=f6e29]
    - paragraph [ref=f6e30]: Licence and activation records are stored on our server in New Zealand. Licence keys are cryptographically signed and bound to your computer, and are stored in your operating system's secure credential store (macOS Keychain or Windows Credential Manager). We take reasonable technical and organisational measures to protect this information.
    - heading "6. Sharing of information" [level=2] [ref=f6e31]
    - paragraph [ref=f6e32]: "We do not sell your information. We share it only with:"
    - list [ref=f6e33]:
      - listitem [ref=f6e34]:
        - strong [ref=f6e35]: Stripe
        - text: — to process payments;
      - listitem [ref=f6e36]:
        - strong [ref=f6e37]: our hosting and email providers
        - text: — to run the licence server and send activation emails;
      - listitem [ref=f6e38]:
        - strong [ref=f6e39]: an AI provider you choose
        - text: — only if you use bring-your-own-key mode and only for the text you submit; and
      - listitem [ref=f6e40]:
        - strong [ref=f6e41]: authorities
        - text: — if we are legally required to disclose it.
    - heading "7. Retention" [level=2] [ref=f6e42]
    - paragraph [ref=f6e43]: We keep licence and activation records while your licence is active, and afterwards only as long as needed for legal, accounting, or fraud-prevention purposes. You may ask us to delete your records at any time by contacting us below.
    - heading "8. Your rights" [level=2] [ref=f6e44]
    - paragraph [ref=f6e45]: You can ask us for a copy of the information we hold about you, ask us to correct it, or ask us to delete it. We will respond within a reasonable time, as required by the New Zealand Privacy Act 2020.
    - heading "9. Changes to this policy" [level=2] [ref=f6e46]
    - paragraph [ref=f6e47]: We may update this policy from time to time. The effective date at the top of this page shows when it was last updated. Significant changes will be reflected here and, where practical, in the app.
    - heading "10. Contact" [level=2] [ref=f6e48]
    - paragraph [ref=f6e49]:
      - text: If you have questions or requests about your privacy, contact us at
      - link "bytemind.nz@gmail.com" [ref=f6e50] [cursor=pointer]:
        - /url: mailto:bytemind.nz@gmail.com
      - text: ", or write to ByteMind Ltd, New Zealand."
